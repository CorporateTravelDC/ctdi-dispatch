# fail2ban filter for the nginx honeypot log. Every line in honeypot.log is a
# trap hit (a request to a path this stack never legitimately serves, or an AI
# decoy path forbidden by robots.txt/llm.txt), so the regex just extracts the
# client IP from the start of the line -- see nginx log_format `honeypot` in
# nginx/conf.d/00-honeypot.conf ('$honeypot_addr - [ ... ] ... TRAP').
[Definition]
failregex = ^<HOST> - \[
ignoreregex =
# time is [$time_local] (standard access-log format); fail2ban auto-detects it.
