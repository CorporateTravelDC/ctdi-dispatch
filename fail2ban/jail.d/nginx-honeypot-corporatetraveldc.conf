# fail2ban jail: any hit on an nginx honeypot path -> ban the source IP.
# Model: the existing nginx-limit-req-corporatetraveldc jail. Inherits the
# firewalld banaction from jail.d/00-firewalld.conf (this box runs firewalld).
[nginx-honeypot-corporatetraveldc]
enabled  = true
# Not a real listening service -- traps live in nginx; scope the ban to web ports.
port     = http,https
filter   = nginx-honeypot
logpath  = /var/log/nginx/honeypot.log
# It's a honeypot: a single hit is malicious. Ban immediately.
maxretry = 1
findtime = 3600
# 1 week. Set to -1 for permanent if you prefer (repeat offenders re-ban anyway).
bantime  = 604800
# Never ban ourselves: loopback (cloudflared/nginx origin), the tailnet CGNAT
# range, and the LAN. Add your own roaming/home IPs here if you test the traps.
ignoreip = 127.0.0.1/8 ::1 100.64.0.0/10 10.0.0.0/24

# Local firewalld ban (direct/LAN/tailnet-effective) PLUS a Cloudflare-edge
# IP Access Rule (effective for tunnel-routed internet traffic too -- see
# docs/HONEYPOT_FAIL2BAN.md's "Closing the Cloudflare-tunnel gap" section).
# cftoken/cfzone come from /etc/fail2ban/jail.local's [DEFAULT] (live-only).
action = %(action_)s
         cloudflare-token-corporatetraveldc[cftoken="%(cftoken)s", cfzone="%(cfzone)s"]
