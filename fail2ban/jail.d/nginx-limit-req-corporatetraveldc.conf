# /etc/fail2ban/jail.d/nginx-limit-req-corporatetraveldc.conf
#
# Rate-based anomaly detection for the public nginx vhosts -- nginx's own
# limit_req module (see nginx/conf.d/00-rate-limit-corporatetraveldc.conf)
# rejects requests over rate=10r/s per source IP; this jail watches for
# those rejections and bans the offending IP for 1 hour, same as the
# existing sshd jail.
#
# CORRECTED 2026-08-26 (Opus blind review C-1): this jail used to combine
# the standard firewalld ban with corporatetraveldc-lockdown (reverts
# host-reach opt-ins stack-wide -- kills Ollama-backed features, severs
# alert delivery, cycles the acars-net containers -- for the duration of
# the ban). Composed with the shared-loopback-IP keying bug fixed in
# nginx/conf.d/00-rate-limit-corporatetraveldc.conf, this meant ~5 req/s
# from ANY internet stranger triggered a full 1-hour outage of the
# alerting/inference stack, repeatably and for free -- and via C-5
# (verify-manifest.sh sourcing a writable config as bash), that same
# root-run lockdown path is also a code-exec trigger, not merely a DoS.
# Two independent fixes: the keying bug is fixed at its source (nginx
# conf, above); this jail also drops corporatetraveldc-lockdown entirely
# -- an ordinary rate-limit trip doesn't warrant reverting stack-wide
# host-reach, and the firewalld ban on the real offending IP (now
# correctly identified per-source since the re-key) is sufficient
# containment on its own. Lockdown stays wired to the honeypot jail
# (fail2ban/jail.d/*honeypot*), where a single hit is genuinely
# malicious intent, not an ordinary traffic burst.
#
# ignoreip added to match the sibling honeypot jail's exemptions -- never
# ban loopback (cloudflared/nginx origin itself), the tailnet CGNAT
# range, or this box's own LAN ranges. This is set here explicitly rather
# than relying on jail.local's [DEFAULT] (root-only, unreadable from this
# session, so its own ignoreip -- if any -- can't be verified; setting it
# per-jail here is correct regardless of what DEFAULT does).

[nginx-limit-req-corporatetraveldc]
enabled  = true
filter   = nginx-limit-req
logpath  = /var/log/nginx/error.log
backend  = auto
maxretry = 1
bantime  = 3600
findtime = 60
ignoreip = 127.0.0.1/8 ::1 100.64.0.0/10 10.x.x.x/8 192.168.x.x/16
action   = %(action_)s
