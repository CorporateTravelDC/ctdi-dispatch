# /etc/fail2ban/jail.d/nginx-limit-req-corporatetraveldc.conf
#
# Rate-based anomaly detection for the public nginx vhosts -- nginx's own
# limit_req module (see nginx/conf.d/00-rate-limit-corporatetraveldc.conf)
# rejects requests over rate=10r/s per source IP; this jail watches for
# those rejections and bans the offending IP for 1 hour, same as the
# existing sshd jail.
#
# action combines the standard firewalld ban (blocks the IP outright) with
# corporatetraveldc-lockdown (reverts host-reach opt-ins stack-wide for the
# duration of the ban -- see fail2ban/action.d/corporatetraveldc-lockdown.conf
# and scripts/lockdown.sh). Both actions run on every ban in this jail;
# firewalld's ban and the lockdown state are independent of each other, so
# either can be adjusted without touching the other.

[nginx-limit-req-corporatetraveldc]
enabled  = true
filter   = nginx-limit-req
logpath  = /var/log/nginx/error.log
backend  = auto
maxretry = 1
bantime  = 3600
findtime = 60
action   = %(action_)s
           corporatetraveldc-lockdown
