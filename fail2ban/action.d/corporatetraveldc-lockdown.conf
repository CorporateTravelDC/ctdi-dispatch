# /etc/fail2ban/action.d/corporatetraveldc-lockdown.conf
#
# On ban: revert the host-reach opt-ins (scripts/lockdown.sh).
# On unban (bantime expires -- fail2ban's own auto-expiry): restore them
# (scripts/restore-network.sh).
#
# This is the automated-trigger half of the "DDoS-adjacent lockdown" design
# in COMPLIANCE_SECURITY.md -- fail2ban's ban/unban lifecycle gives automatic
# trigger and automatic reversion for free, matching Cloudflare's own
# mitigate-then-lift-once-traffic-normalizes behavior, without any new
# scheduling/cooldown logic beyond what fail2ban already provides.
#
# --reason passes the banned IP through for the ntfy notification and
# lockdown state file; lockdown.sh/restore-network.sh don't otherwise act
# on it (this is not an IP-specific block -- it's a global host-reach
# revert, see lockdown.sh's own header comment for why).
#
# Signed-manifest integrity (docs/COMPLIANCE_SECURITY.md "Signed Manifest
# Integrity"): actionban/actionunban chain an independent verify-manifest.sh
# call before invoking the actual script, same config-level defense-in-depth
# as fail2ban/action.d/cloudflare-token-corporatetraveldc.conf.

[Definition]

actionstart =
actionstop =
actioncheck =

actionban = /opt/corporatetraveldc/private/ctdi-dispatch-internal/scripts/verify-manifest.sh "scripts/lockdown.sh" && /opt/corporatetraveldc/private/ctdi-dispatch-internal/scripts/lockdown.sh --reason "fail2ban ban: <ip>"

actionunban = /opt/corporatetraveldc/private/ctdi-dispatch-internal/scripts/verify-manifest.sh "scripts/restore-network.sh" && /opt/corporatetraveldc/private/ctdi-dispatch-internal/scripts/restore-network.sh --reason "fail2ban unban: <ip>"

[Init]
