# fail2ban/action.d/cloudflare-token-corporatetraveldc.conf
#
# Cloudflare-edge IP Access Rule ban -- extends the stock cloudflare-token.conf
# action (Logic-32, shipped in /etc/fail2ban/action.d/) with a classified,
# dashboard-legible "notes" field instead of a bare "Fail2Ban <name>" string.
#
# v2 (2026-08-09): actionban/actionunban now delegate entirely to
# scripts/cf-honeypot-ban.sh instead of piping straight into `curl -s`. The
# v1 version silently failed in production: fail2ban confirmed the ban fired
# (NOTICE Ban <ip> in fail2ban.log) but no Cloudflare rule was created, and
# nothing showed as an error -- because plain `curl -s` only returns non-zero
# on connection failures, not HTTP 4xx/5xx, so a failed API call still looked
# like success to fail2ban. cf-honeypot-ban.sh checks the actual HTTP status
# and writes to stderr + exits non-zero on failure, so real failures now
# surface as ERROR lines in fail2ban.log instead of silence.
#
# <ip> is still the only attacker-influenced value that ever crosses into a
# shell command line -- fail2ban regex-validates it as a well-formed address
# before substitution, so it carries no injection surface (see
# cf-honeypot-notes.sh's header for why <matches> is deliberately avoided).
#
# cftoken/cfzone come from /etc/fail2ban/jail.local's [DEFAULT] section
# (live-only, never the repo) and are passed as environment variables
# (CFZONE=/CFTOKEN=) rather than script arguments, so they never appear in
# `ps aux` output to other local users -- only via /proc/<pid>/environ,
# readable solely by root (which already has jail.local itself).
#
# Wire onto a jail as a SECOND action alongside the default firewalld one:
#   action = %(action_)s
#            cloudflare-token-corporatetraveldc[cftoken="%(cftoken)s", cfzone="%(cfzone)s"]

[Definition]

actionstart =
actionstop =
actioncheck =

actionban = CFZONE="<cfzone>" CFTOKEN="<cftoken>" /opt/corporatetraveldc/private/ctdi-dispatch-internal/scripts/cf-honeypot-ban.sh ban "<ip>" "<cftarget>"

actionunban = CFZONE="<cfzone>" CFTOKEN="<cftoken>" /opt/corporatetraveldc/private/ctdi-dispatch-internal/scripts/cf-honeypot-ban.sh unban "<ip>" "<cftarget>"

[Init]
cftarget = ip
cfmode = block

[Init?family=inet6]
cftarget = ip6
