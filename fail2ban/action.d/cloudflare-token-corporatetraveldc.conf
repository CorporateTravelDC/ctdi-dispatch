# fail2ban/action.d/cloudflare-token-corporatetraveldc.conf
#
# Cloudflare-edge IP Access Rule ban -- extends the stock cloudflare-token.conf
# action (Logic-32, shipped in /etc/fail2ban/action.d/) with a classified,
# dashboard-legible "notes" field instead of a bare "Fail2Ban <name>" string.
#
# v2 (2026-08-09): actionban/actionunban now delegate entirely to
# scripts/cf-honeypot-ban.sh instead of piping straight into `curl -s`. The
# v1 version silently failed in production: fail2ban confirmed the ban fired
# (NOTICE Ban <ip> in fail2ban.log) but no Cloudflare rule was created, and
# nothing showed as an error -- because plain `curl -s` only returns non-zero
# on connection failures, not HTTP 4xx/5xx, so a failed API call still looked
# like success to fail2ban. cf-honeypot-ban.sh checks the actual HTTP status
# and writes to stderr + exits non-zero on failure, so real failures now
# surface as ERROR lines in fail2ban.log instead of silence.
#
# <ip> is still the only attacker-influenced value that ever crosses into a
# shell command line -- fail2ban regex-validates it as a well-formed address
# before substitution, so it carries no injection surface (see
# cf-honeypot-notes.sh's header for why <matches> is deliberately avoided).
#
# 2026-10-03: the TOKEN NO LONGER APPEARS IN THIS FILE OR ON THE ACTION LINE.
# The previous design passed `CFTOKEN="<cftoken>"` as an env-assignment prefix
# -- reasoning (correctly) that it would not show in `ps`, but fail2ban
# EXPANDS AND LOGS the whole action command string on every ban/unban/error,
# so the token landed in /var/log/fail2ban.log in plaintext (operator
# observed it across multiple log files 2026-09-23). The script
# (cf-honeypot-ban.sh) reads the token from a root-only FILE instead; this
# action passes only that file's PATH. cfzone still comes from jail.local
# [DEFAULT] -- a zone id is not a credential and is in every API URL anyway.
#
#   /etc/corporatetraveldc/cf-honeypot.token    root:root 0600, bare token
#
# Wire onto a jail as a SECOND action alongside the default firewalld one
# (no cftoken parameter any more):
#   action = %(action_)s
#            cloudflare-token-corporatetraveldc[cfzone="%(cfzone)s"]
#
# Signed-manifest integrity (docs/COMPLIANCE_SECURITY.md "Signed Manifest
# 2026-10-04 (duel C1 follow-up): these actions run as ROOT, so they now run
# the root-owned INSTALLED copies in /usr/local/libexec/ctdc and chain
# installed-check.sh (sha256 against the root-owned install record written
# by install-root-copies.sh after it verified the signed manifest) instead
# of the checkout's verify-manifest.sh -- root never executes a file from
# the operator-writable checkout. Deployed by install-root-copies.sh.
# Integrity"): actionban/actionunban chain an independent verify-manifest.sh
# call BEFORE ever invoking cf-honeypot-ban.sh, as a config-level check that
# doesn't depend on that script's own inline self-check surviving tampering
# -- a script can neutralize a check embedded in itself; it can't also
# rewrite this separate config file to remove this one without a second,
# independent compromise.

[Definition]

actionstart =
actionstop =
actioncheck =

actionban = /usr/local/libexec/ctdc/installed-check.sh "scripts/cf-honeypot-ban.sh" && CFZONE="<cfzone>" CFTOKEN_FILE=/etc/corporatetraveldc/cf-honeypot.token /usr/local/libexec/ctdc/cf-honeypot-ban.sh ban "<ip>" "<cftarget>"

actionunban = /usr/local/libexec/ctdc/installed-check.sh "scripts/cf-honeypot-ban.sh" && CFZONE="<cfzone>" CFTOKEN_FILE=/etc/corporatetraveldc/cf-honeypot.token /usr/local/libexec/ctdc/cf-honeypot-ban.sh unban "<ip>" "<cftarget>"

[Init]
cftarget = ip
cfmode = block

[Init?family=inet6]
cftarget = ip6
