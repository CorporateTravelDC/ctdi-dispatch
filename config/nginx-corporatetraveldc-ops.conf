# ops.csexecutiveservices.com — CSEX Dispatch Ops (dispatch-runner React app)
#
# dispatch-runner.csexecutiveservices.com has been retired as a public endpoint
# (kept deployed but unlisted — reserved for future demo use only). Its full
# feature set (map, TFR, trains/EOTD, briefs, admin, signals) is now what's
# served at ops.csexecutiveservices.com instead of the old static PWA.
#
# Install:
#   sudo cp /opt/corporatetraveldc/ctdi-dispatch-internal/config/nginx-corporatetraveldc-ops.conf \
#           /etc/nginx/conf.d/corporatetraveldc-ops.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name ops.csexecutiveservices.com;

    location / {
        limit_req          zone=corporatetraveldc_lr burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # SSE streams — no buffering, long timeout
    location ~ ^/api/(stream|ntfy/stream)$ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
