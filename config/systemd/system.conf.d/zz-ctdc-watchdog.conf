# zz-ctdc-watchdog.conf -- overrides watchdog.conf's RuntimeWatchdogSec=14.
# The zz- prefix is load-bearing: system.conf.d drop-ins apply in lexical
# order and the LAST one wins. The first version was named 90-ctdc-...,
# which sorts BEFORE watchdog.conf, so 14s stayed in force (found 21:20 ET).
# (2026-10-04, operator): DIAGNOSTIC 180s for one week after the 19:53 hard
# reset (a >14s stall at load ~20 most likely tripped the BCM2835 hardware
# watchdog). corporatetraveldc-stall-monitor measures the worst stall all
# week; corporatetraveldc-watchdog-tune (once, Sun 2026-10-11 20:00 ET)
# rewrites this file to 120% of that worst stall (floor 30s, cap 180s).
# Installed to /etc/systemd/system.conf.d/ by the operator (sudo install -D ...);
# takes effect on `systemctl daemon-reexec`.
[Manager]
RuntimeWatchdogSec=180
