# Operator 2026-11-17: NetworkManager's connectivity check is OFF until Starlink is the primary uplink.
# The failover watchdog (scripts/net-failover-watchdog.sh) is the sole route arbiter. NM's check adds a
# +20000 metric penalty to a device whose check fails; on 2026-11-17 that penalty also hit the IPv6
# default and turned it into a multipath route split across the dead wld0 next hop and enu1 (hotspot
# IPv6 test), i.e. about half of all IPv6 connections were sent into the dead router.
# History: re-enabled after the 2026-10-29 Wi-Fi incident; this overrides that and the older
# no-connectivity-check.conf.
[connectivity]
enabled=false
