# /etc/gai.conf -- 2026-11-17 (operator: IPv6 priority on every uplink).
# The previous file held only `precedence ::ffff:0:0/96  100` (twice), which made getaddrinfo() prefer
# IPv4 everywhere on the box (the IPv4-only stance after the 2026-09-02 hotspot IPv6 tether throttle).
# With no precedence lines glibc's RFC 6724 defaults apply: IPv6 first, IPv4 as fallback.
# Nothing else was in the file. To go back to IPv4 first, restore the line above.
