# postgresql.conf -- corporatetraveldc-pgsql (PostgreSQL 16), 2026-09-06.
#
# Bind-mounted read-only into the container by
# .config/containers/systemd/corporatetraveldc-pgsql.container. Tracked and
# signed like all other config. Every number here traces to a measurement in
# docs/POSTGRES_MIGRATION.md -- change the measurement before changing the
# number.
#
# Box: Raspberry Pi 5, 4 cores, 15 GB RAM shared with two resident llama
# tiers (7.2 G), NVMe (Phison), container cap 1.5 G RAM + 1.5 G swap.
#
# Workload (measured 2026-09-05): inserts are tiny (~50k rows/day across the
# whole write set); the load is HOT-ROW UPDATES -- ~300 tbfm_sequences rows
# re-upserted every few seconds, ~2.4k flight_events rows updated per 15 min.
# So this config is tuned for update churn (autovacuum, fillfactor via DDL,
# cheap commits), not for bulk volume or big analytical reads.

# ---- connections ----------------------------------------------------------
# App containers connect over the UNIX SOCKET in the shared
# corporatetraveldc-pgsql-sock volume, not TCP -- pasta's
# host.containers.internal maps to the host's default-route interface, never
# loopback, so a loopback-only publish is unreachable from containers (measured
# 2026-09-06) and a LAN publish would break on network failover. TCP exists
# only for bare-host tools on the box: inside the container postgres listens
# on all container interfaces and the HOST side restricts that to 127.0.0.1
# (PublishPort=127.0.0.1:5432).
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0777
# Our own rules (scram on both paths) -- the initdb-generated pg_hba.conf in
# PGDATA `trust`s every local connection and is deliberately never used.
hba_file = '/etc/postgresql/pg_hba.conf'
# 14 containers x a per-process pool of <=4 = 56. Each idle backend costs
# ~5-10 MB, so do not raise this casually inside a 1.5 G cap.
max_connections = 60
superuser_reserved_connections = 3

# ---- memory ---------------------------------------------------------------
# 25% of the 1.5 G cap. The hot working set is far smaller than this; the
# rest of the 90-day history is cold and is served from the OS page cache /
# disk. Raising this does not improve concurrency (MVCC does that), it only
# competes with the llama tiers for RAM.
shared_buffers = 384MB
# Advisory hint to the planner, not an allocation: roughly what the kernel
# can cache for us on a box this tight.
effective_cache_size = 1GB
# Per-sort/hash, per-query-node. Queries here are small; keep this low so
# max_connections x work_mem cannot blow the cap.
work_mem = 8MB
maintenance_work_mem = 128MB
autovacuum_work_mem = 64MB
huge_pages = off
dynamic_shared_memory_type = posix

# ---- WAL / durability -----------------------------------------------------
# synchronous_commit=off is the single biggest write-latency win and is the
# same trade the SQLite per-row-fsync was paying for in the wrong currency:
# a commit returns before its WAL record is flushed, so a crash can lose at
# most ~wal_writer_delay (200 ms) of the most recent commits. Every feed we
# ingest re-sends state continuously (FDPS/TBFM/STDDS positions, Amtrak
# status, NWS alerts), so 200 ms of telemetry is nothing; it is NOT data
# corruption (the WAL stays consistent). Operator-originated writes
# (watchlist edits, runsheet) are rare and can opt back in per-transaction
# with SET LOCAL synchronous_commit = on in the access layer.
synchronous_commit = off
wal_writer_delay = 200ms
wal_compression = zstd
wal_level = replica
# Checkpoints: spread each one over 90% of the interval so the NVMe never
# sees a burst, and size WAL so the 50k rows/day never forces an early one.
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 256MB
# Local NVMe; the kernel already batches. fsync stays ON -- only the
# per-commit wait is relaxed above.
fsync = on
full_page_writes = on

# ---- autovacuum -- THE config that matters for this workload --------------
# Postgres never deletes user rows on its own. MVCC leaves the OLD VERSION of
# every updated row on disk until no transaction can see it; autovacuum is
# the garbage collector that recycles that space. Retention (90-day floor)
# is enforced separately by our own partition-drop job and is unaffected.
#
# With ~300 rows rewritten every few seconds, default triggers (20% of the
# table dead) would let the hot tables bloat for days between vacuums. These
# global settings make vacuum run early and often but CHEAPLY; the per-table
# overrides (scale_factor 0.01, fillfactor 70) are applied in the schema DDL
# on the hot tables only, so cold reference/history tables are left alone.
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 15s
autovacuum_vacuum_threshold = 200
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_threshold = 200
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 400
# Freeze aggressively enough that a 90-day table never needs an emergency
# anti-wraparound vacuum at a bad moment.
autovacuum_freeze_max_age = 200000000
vacuum_freeze_min_age = 5000000

# ---- planner / IO ---------------------------------------------------------
# NVMe: random reads cost about the same as sequential.
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200
# 4 cores shared with everything else -- keep parallelism modest.
max_worker_processes = 6
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1
jit = off

# ---- behaviour / safety ---------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
# A runaway report query must not hold locks or buffers forever. Ingest
# statements are sub-second; report-tier skills that need longer set it
# per-session.
statement_timeout = 60s
lock_timeout = 10s
idle_in_transaction_session_timeout = 60s
# Close the gap left by the SQLite era, where a text value written into a
# REAL column was silently accepted (the arrival_time epoch-vs-ISO bug).
# Postgres already rejects that; nothing to set, noted for the record.

# ---- logging --------------------------------------------------------------
# To the container's stdout -> journald, same as every other unit.
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
# Surface exactly the things that used to be invisible in SQLite: slow
# statements, lock waits, and every autovacuum that took real time.
log_min_duration_statement = 500ms
log_lock_waits = on
log_autovacuum_min_duration = 1s
log_checkpoints = on
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %u@%d %a '
# Cumulative statement stats -- what pg_stat_statements needs; cheap.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 2000
pg_stat_statements.track = top
track_io_timing = on
