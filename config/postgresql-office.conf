# postgresql-office.conf -- corporatetraveldc-pgsql-office (PostgreSQL 16), 2026-10-20.
#
# The OFFICE SKELETONS instance's config (Firefly III, Paperless-ngx, Vikunja),
# bind-mounted read-only by
# .config/containers/systemd/office-skeletons/corporatetraveldc-pgsql-office.container.
# TEMPLATE, disabled until after the feature freeze. A small sibling of
# config/postgresql-demo.conf; unlike the demo instance, this one will hold
# records of their own (a ledger, documents), so durability is NOT relaxed.

# ---- connections ----------------------------------------------------------
# The apps reach this server by container name over office-db.network
# (Internal=true; no PublishPort, so nothing on the host or the tailnet can
# open a TCP connection). Host-side tools use `podman exec` on the socket.
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0770
# Our own rules (config/pg_hba-office.conf: each app role to its own database
# only, scram; everything else rejected). The initdb-generated pg_hba.conf in
# PGDATA `trust`s every local connection and is never used.
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = 'scram-sha-256'
max_connections = 40
superuser_reserved_connections = 3

# ---- memory ---------------------------------------------------------------
shared_buffers = 64MB
effective_cache_size = 192MB
work_mem = 4MB
maintenance_work_mem = 32MB
autovacuum_work_mem = 16MB
huge_pages = off
dynamic_shared_memory_type = posix

# ---- WAL / durability -----------------------------------------------------
# Financial records and documents of record: commit waits for the WAL flush.
synchronous_commit = on
fsync = on
full_page_writes = on
wal_compression = zstd
wal_level = minimal
max_wal_senders = 0
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 256MB
min_wal_size = 64MB

# ---- autovacuum -----------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 1
autovacuum_naptime = 60s

# ---- planner / IO ---------------------------------------------------------
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 100
max_worker_processes = 3
max_parallel_workers = 1
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
jit = off

# ---- behaviour / safety ---------------------------------------------------
# No global statement_timeout: the apps run their own schema migrations at
# start-up, which can exceed a short cap. Abandoned transactions are cut.
timezone = 'UTC'
log_timezone = 'UTC'
lock_timeout = 30s
idle_in_transaction_session_timeout = 15min

# ---- logging --------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000ms
log_lock_waits = on
log_checkpoints = on
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %u@%d %a '
