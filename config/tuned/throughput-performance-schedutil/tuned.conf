#
# CTDI dispatch -- throughput-performance, but with schedutil instead of
# the performance governor. See docs note below for the full incident.
#
# 2026-08-06: cores were found pinned to the `performance` cpufreq
# governor -- confirmed live via /sys/devices/system/cpu/cpu*/cpufreq/
# scaling_governor, all 4 cores sitting at max 2400MHz constantly, not
# scaling with load. Root cause: tuned's active profile is
# `throughput-performance`, which explicitly sets `governor=performance`
# in its own [cpu] section (see /usr/lib/tuned/profiles/throughput-performance/tuned.conf).
#
# `schedutil` WAS running as the active governor at some point before
# the 2026-08-05 case migration -- confirmed by the operator, not
# assumed. It did not survive. Checked whether it was ever tracked
# anywhere durable in this repo (systemd unit, udev rule, boot script,
# /etc/default/cpufrequtils-equivalent): it was not -- grep across the
# whole repo turns up only documentation mentions, no actual mechanism.
# It was set live-only at some point (most likely a one-off `tuned-adm
# profile balanced` or `cpupower frequency-set -g schedutil`), never
# captured anywhere durable, and was lost on reimage during the case
# migration -- same root-cause class as the ollama_governor.sh and
# cloudflared config drift already found and fixed earlier the same
# night.
#
# Fix is NOT a manual `cpupower frequency-set` one-off (reverts on
# reboot, and would fight tuned -- see the cpupower.service vs. tuned
# conflict already found and left deliberately dormant elsewhere on this
# box) and NOT switching to tuned's built-in `balanced` profile wholesale
# (that changes far more than the governor -- energy_perf_bias,
# min_perf_pct, boost, disk readahead, vm.dirty_bytes/dirty_background_bytes,
# none of which the operator asked to touch, and some of which may have
# been chosen deliberately for this workload).
#
# Instead: a custom profile that INHERITS throughput-performance in full
# (via include=) and overrides ONLY the [cpu] section's governor. tuned's
# own idiomatic mechanism for exactly this -- a small, targeted override
# on top of a known-good base profile, not a fight between two competing
# systems. Everything else throughput-performance already tuned (disk
# readahead, vm dirty-ratio thresholds, network buffers) is untouched.
#
# energy_perf_bias/min_perf_pct/boost from the parent profile are left
# as-is -- min_perf_pct in particular is an intel_pstate-driver knob with
# no effect on this Pi 5's generic ARM cpufreq driver, so overriding it
# here would be a no-op either way. governor= is the one setting that
# actually controls this hardware's behavior.
[main]
include=throughput-performance

[cpu]
governor=schedutil
