# corporatetraveldc-dispatch.tailxxxxxxx.ts.net — HTTPS on the tailnet only
#
# Makes the runner (admin/full-access surface) installable as a PWA over
# Tailscale. Chrome/Android will not offer a full "Install" (only "Create
# shortcut") for a page served over plain HTTP on a bare IP — a secure
# context (HTTPS or localhost) is required. This gives the Tailscale side
# its own real TLS listener using a tailscale-issued cert, bound only to
# the tailnet IP so it's never reachable off-tailnet.
#
# Install:
#   sudo mkdir -p /etc/nginx/tailnet-certs
#   sudo cp /home/corporatetraveldc/corporatetraveldc-dispatch.tailxxxxxxx.ts.net.crt /etc/nginx/tailnet-certs/
#   sudo cp /home/corporatetraveldc/corporatetraveldc-dispatch.tailxxxxxxx.ts.net.key /etc/nginx/tailnet-certs/
#   sudo chmod 600 /etc/nginx/tailnet-certs/corporatetraveldc-dispatch.tailxxxxxxx.ts.net.key
#   sudo cp /path/to/this/file /etc/nginx/conf.d/tailnet-runner-https.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Renewal: tailscale certs are short-lived (90 days) and `tailscale cert`
# does not auto-renew on its own. Re-run `tailscale cert
# corporatetraveldc-dispatch.tailxxxxxxx.ts.net` from the corporatetraveldc
# user's home dir periodically (or wire a systemd timer) and re-copy the
# refreshed .crt/.key into /etc/nginx/tailnet-certs/, then reload nginx.

server {
    listen 100.x.x.x:443 ssl;
    server_name corporatetraveldc-dispatch.tailxxxxxxx.ts.net;

    ssl_certificate     /etc/nginx/tailnet-certs/corporatetraveldc-dispatch.tailxxxxxxx.ts.net.crt;
    ssl_certificate_key /etc/nginx/tailnet-certs/corporatetraveldc-dispatch.tailxxxxxxx.ts.net.key;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering    off;
        proxy_cache        off;
    }

    location ~ ^/api/(stream|ntfy/stream)$ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# Optional: redirect plain-HTTP tailnet access (100.x.x.x:80) to this
# HTTPS vhost too, if you want :80 on the tailnet to stop serving the
# insecure-context version at all. Not added by default since the
# existing corporatetraveldc-ops.conf and any other :80 vhosts might
# still expect plain HTTP on this IP for other purposes -- add manually if
# wanted:
#
# server {
#     listen 100.x.x.x:80;
#     server_name corporatetraveldc-dispatch.tailxxxxxxx.ts.net;
#     return 301 https://$host$request_uri;
# }
