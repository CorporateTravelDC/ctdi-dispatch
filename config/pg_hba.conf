# pg_hba.conf -- corporatetraveldc-pgsql client authentication (2026-09-06).
# Bind-mounted read-only into the container and selected by
# `hba_file` in config/postgresql.conf, so the stock image's initdb-generated
# rules (which `trust` every local/loopback connection) are never in force.
# See docs/POSTGRES_MIGRATION.md.
#
# Two paths exist, both password-authenticated (scram-sha-256):
#   local  -- the unix socket in the shared corporatetraveldc-pgsql-sock
#             volume. This is how every app container connects: pasta's
#             host.containers.internal maps to the host's default-route
#             interface address, NOT loopback, so a loopback-only TCP publish
#             is unreachable from containers and a LAN-address publish would
#             break on wld0<->enu1 failover. The socket has neither problem
#             and skips pasta's per-packet userspace hop.
#   host   -- for bare-host scripts/psql on the box itself. The HOST side is
#             what restricts this to loopback (PublishPort=127.0.0.1:5432);
#             the address column here cannot, because pasta rewrites the
#             source of a host-loopback connection to the host's interface
#             address (a 127.0.0.1/32 rule saw the wld0 address and refused,
#             measured 2026-09-06) and that address changes on failover.
#             So the rule is `all` -- reachability is decided by the bind,
#             authentication by scram.
# Nothing else. No replication role.
#
# 2026-10-16 (demo/production database split): the demo instance's roles and
# database are rejected HERE BY NAME, before the catch-alls, so that even a
# `demo` role someone creates on this instance by mistake, or a demo-side
# process handed this socket, authenticates to nothing. First match wins:
# these lines precede the scram catch-alls (tests/scripts/test_demo_isolation.py
# holds the order). The demo roles live only on corporatetraveldc-pgsql-demo
# (config/pg_hba-demo.conf).
#
# TYPE  DATABASE                USER        ADDRESS        METHOD
local   all                     demo                       reject
host    all                     demo        all            reject
local   all                     demo_owner                 reject
host    all                     demo_owner  all            reject
local   corporatetraveldc_demo  all                        reject
host    corporatetraveldc_demo  all         all            reject
# 2026-10-20 (office skeletons, template): the office instance's roles and
# databases (corporatetraveldc-pgsql-office, config/pg_hba-office.conf) are
# rejected here by name too, same reasoning as the demo lines above.
local   all                     office_owner               reject
host    all                     office_owner all           reject
local   all                     firefly                    reject
host    all                     firefly     all            reject
local   all                     paperless                  reject
host    all                     paperless   all            reject
local   all                     vikunja                    reject
host    all                     vikunja     all            reject
local   office,firefly,paperless,vikunja all               reject
host    office,firefly,paperless,vikunja all  all          reject
local   all                     all                        scram-sha-256
host    all                     all         all            scram-sha-256
