# config/chrony-nts.conf -- tracked, signed alongside the rest of the stack
# (see scripts/sign-manifest.sh). Deployed to /etc/chrony.d/50-nts.conf by
# scripts/setup-nts-server.sh, which also handles the cert placement,
# SELinux port labeling, and confdir wiring this file depends on.
#
# Design, 2026-09-18 (operator directive: "as air-tight as selinux enforcing
# + gpg sign is for the rest of the stack"):
#
# - NO custom SELinux policy module, NO booleans, NO permissive domains.
#   Verified via sesearch against the box's live stock policy before writing
#   this: chronyd_t already has `allow chronyd_t ntske_port_t:tcp_socket
#   {name_bind name_connect}` and (via the nsswitch_domain attribute) read
#   access to cert_t files, both in unmodified Fedora reference policy. The
#   only local action needed is `semanage port -a -t ntske_port_t -p tcp
#   4460` to actually bind that type to the NTS-KE port on this box, plus
#   placing the cert/key in the standard /etc/pki/tls/{certs,private} paths,
#   which get cert_t by default via matchpathcon -- no relabeling rules to
#   maintain.
# - NO firewall changes needed: tailscale0 is already in firewalld's
#   "trusted" zone (checked live, 2026-09-18) -- tailnet clients already
#   reach any port this box opens. The `allow` line below is the real access
#   boundary, not the firewall.
# - Server cert is Tailscale-issued (`tailscale cert
#   corporatetraveldc-dispatch.tailxxxxxxx.ts.net`) -- a real cert tailnet
#   clients can validate normally, not a self-signed one requiring each
#   client to carry a custom trust anchor. Tailscale certs are short-lived
#   (~90 days); scripts/tailscale-cert-refresh-nts.sh handles renewal.

# --- NTS SERVER: serve authenticated time to the tailnet ---
ntsservercert /etc/pki/tls/certs/corporatetraveldc-dispatch.tailxxxxxxx.ts.net.crt
ntsserverkey /etc/pki/tls/private/corporatetraveldc-dispatch.tailxxxxxxx.ts.net.key

# Tailnet CGNAT range only -- this is the actual access boundary (the
# firewall trusts the whole interface, so scoping happens here).
allow 100.64.0.0/10

# --- NTS CLIENT: this box's own upstream, authenticated ---
# Three independent NTS-capable operators (never rely on one) --
# Cloudflare (Anycast, widely used reference NTS deployment), Netnod
# (Swedish national time authority, NTS since 2020), SIDN Labs/time.nl
# (Netherlands ccTLD registry, operator's choice 2026-09-18). iburst for
# fast initial sync, matching the existing pool line's style in
# /etc/chrony.conf.
#
# 2026-09-18: time.nist.gov swapped out here -- three consecutive NTS-KE
# timeouts over IPv6 across restarts (live-verified via journalctl, not
# assumed), while Cloudflare and Netnod both worked cleanly from the same
# box at the same time. A brief ptbtime1.ptb.de trial was superseded by
# the operator's actual pick, nts1.time.nl, before it was verified either
# way. Verify this one via `chronyc sources`/journalctl after deploying,
# same as how NIST's failure was actually caught, and swap again if it
# doesn't hold up.
server time.cloudflare.com iburst nts
server nts.sth1.ntp.se iburst nts
server nts1.time.nl iburst nts

# Keep NTS cookies/keys across restarts (already set box-wide in
# /etc/chrony.conf's ntsdumpdir, listed here for this file's own
# documentation completeness -- not duplicated in the deployed output).
