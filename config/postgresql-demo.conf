# postgresql-demo.conf -- corporatetraveldc-pgsql-demo (PostgreSQL 16), 2026-10-16.
#
# The PUBLIC DEMO instance's config, bind-mounted read-only by
# .config/containers/systemd/corporatetraveldc-pgsql-demo.container. A small
# sibling of config/postgresql.conf: one reader process (demo-api), one
# writer (the host-side scrub, nightly), a few hundred MB of scrubbed zlib
# payloads. Nothing here is tuned for ingest churn because there is none.

# ---- connections ----------------------------------------------------------
# Demo app containers connect over the socket volume
# (corporatetraveldc-pgsql-demo-sock, mounted at /var/run/postgresql-demo in
# the demo containers; DEMO_PG_HOST). TCP exists only for host-side tools:
# the HOST side restricts it to 127.0.0.1 (PublishPort=127.0.0.1:5433).
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0777
# Our own rules (config/pg_hba-demo.conf: demo + demo_owner on the socket,
# demo_owner only over TCP, everything else rejected) -- the initdb-generated
# pg_hba.conf in PGDATA `trust`s every local connection and is never used.
hba_file = '/etc/postgresql/pg_hba.conf'
max_connections = 30
superuser_reserved_connections = 3

# ---- memory ---------------------------------------------------------------
shared_buffers = 128MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 32MB
autovacuum_work_mem = 16MB
huge_pages = off
dynamic_shared_memory_type = posix

# ---- WAL / durability -----------------------------------------------------
# Everything in this database is a derivative of production and rebuildable
# by scrub-demo-source.py --backfill, so the relaxed commit wait costs
# nothing worth paying for.
synchronous_commit = off
wal_writer_delay = 200ms
wal_compression = zstd
wal_level = minimal
max_wal_senders = 0
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 256MB
min_wal_size = 64MB
fsync = on
full_page_writes = on

# ---- autovacuum -----------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 1
autovacuum_naptime = 60s

# ---- planner / IO ---------------------------------------------------------
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 100
max_worker_processes = 3
max_parallel_workers = 1
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
jit = off

# ---- behaviour / safety ---------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
statement_timeout = 30s
lock_timeout = 10s
idle_in_transaction_session_timeout = 60s

# ---- logging --------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 500ms
log_lock_waits = on
log_checkpoints = on
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %u@%d %a '
