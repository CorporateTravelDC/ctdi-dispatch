# pg_hba-office.conf -- corporatetraveldc-pgsql-office client authentication
# (2026-10-20, office skeletons; TEMPLATE, disabled until after the feature
# freeze). Bind-mounted read-only into the OFFICE instance's container and
# selected by `hba_file` in config/postgresql-office.conf, so the stock image's
# initdb-generated rules (which `trust` every local connection) are never in
# force.
#
# One role per service, one database per role, first match wins:
#   firefly / paperless / vikunja -- each app role into its OWN database only:
#                  TCP from the office-db network (`samenet`: the subnets this
#                  server is attached to; office-db.network is Internal=true
#                  and nothing is published) and the socket (the login check
#                  of scripts/office-skeleton-ctl.py runs over `podman exec`).
#   office_owner  -- the instance owner (POSTGRES_USER): the socket only
#                  (pg_isready, the init SQL, the password step). Never TCP.
# The platform's own roles (dispatch, demo, demo_owner) are rejected BY NAME
# first, and everything else -- any other role, any other database,
# replication -- by the catch-alls, not by a missing line.
#
# TYPE  DATABASE    USER          ADDRESS   METHOD
local   all         dispatch                reject
host    all         dispatch      all       reject
local   all         demo                    reject
host    all         demo          all       reject
local   all         demo_owner              reject
host    all         demo_owner    all       reject
local   office      office_owner            scram-sha-256
# First-boot init connects as POSTGRES_USER to database `postgres` on the
# socket to CREATE DATABASE (the demo instance's 2026-10-17 lesson).
local   postgres    office_owner            scram-sha-256
local   firefly     firefly                 scram-sha-256
host    firefly     firefly       samenet   scram-sha-256
local   paperless   paperless               scram-sha-256
host    paperless   paperless     samenet   scram-sha-256
local   vikunja     vikunja                 scram-sha-256
host    vikunja     vikunja       samenet   scram-sha-256
local   all         all                     reject
host    all         all           all       reject
