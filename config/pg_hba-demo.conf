# pg_hba-demo.conf -- corporatetraveldc-pgsql-demo client authentication
# (2026-10-16, demo/production database split). Bind-mounted read-only into
# the DEMO instance's container and selected by `hba_file` in
# config/postgresql-demo.conf, so the stock image's initdb-generated rules
# (which `trust` every local connection) are never in force.
#
# Two roles, one database, first match wins:
#   demo        -- the public-demo application role (demo-api, runner-demo),
#                  over the unix socket volume ONLY (corporatetraveldc-pgsql-
#                  demo-sock). Never over TCP: the host publish exists for the
#                  scrub, not for the app role.
#   demo_owner  -- the instance owner. Socket (pg_isready, in-container
#                  tools) and TCP (the host-side scrub and
#                  pg_migrate --instance demo over 127.0.0.1:5433; the host
#                  bind restricts reachability, scram authenticates -- the
#                  address column cannot, pasta rewrites loopback sources).
# Everything else -- any other role, any other database, replication -- is
# rejected explicitly, not left to a missing line.
#
# TYPE  DATABASE                USER         ADDRESS   METHOD
local   corporatetraveldc_demo  demo                   scram-sha-256
local   corporatetraveldc_demo  demo_owner             scram-sha-256
host    corporatetraveldc_demo  demo_owner   all       scram-sha-256
# 2026-10-17: the image's first-boot init connects as POSTGRES_USER to database `postgres`
# on the socket to CREATE DATABASE; without this line init half-failed (cluster, no database).
local   postgres                demo_owner             scram-sha-256
local   all                     all                    reject
host    all                     all          all       reject
