tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: /home/corporatetraveldc/.cloudflared/00000000-0000-0000-0000-000000000000.json

ingress:
  # dispatch — CF Access gated (Tailscale + auth required)
  - hostname: dispatch.example.com
    service: http://127.0.0.1:80

  # ops.example.com RETIRED 2026-08-02 -- app layer already
  # hard-rejected this hostname (runner/main.py _RETIRED_HOSTNAMES) and no
  # nginx vhost has matched it since. Live dispatch access is Tailscale-
  # only now: https://corporatetraveldc-dispatch.tailxxxxxxx.ts.net
  #
  # 2026-08-05: this tunnel is dashboard/API-managed -- confirmed by
  # restarting cloudflared and diffing this file's ingress list against
  # the "Updated to new configuration" log line it printed on
  # registration: the two don't match (live remote config includes
  # mcp./cockpit./dav.example.com, none of which are in this
  # file; this file's apex/www entries aren't in the remote list either).
  # This local ingress: block does not actually route tunnel traffic --
  # cloudflared only reads tunnel:/credentials-file: from it and fetches
  # real ingress rules from Cloudflare. The ops entry here was removed for
  # accuracy only (had no live effect either way); the record that
  # actually matters -- the live remote push -- already had no ops entry,
  # confirming the 2026-08-02 retirement was done correctly via the
  # dashboard/API, same as the earlier (now-replaced) version of this
  # comment claimed. Separately flagged: mcp./cockpit./dav. are live on
  # the real tunnel and undocumented anywhere in this repo -- worth an
  # audit, not addressed here.

  # dispatch-runner — public rolling demo (password-gated at the app
  # layer, see runner main.py DEMO_MODE). Open over tunnel same as ops,
  # since the gate happens after this hop, not before it. Added 2026-08-01.
  - hostname: dispatch-runner.example.com
    service: http://127.0.0.1:80


  # openwebui — Open WebUI (Ollama chat frontend) — CF Access gated
  - hostname: openwebui.example.com
    service: http://127.0.0.1:80

  # ollama — raw Ollama API — CF Access gated
  - hostname: ollama.example.com
    service: http://127.0.0.1:80

  # adsb/acars removed 2026-08-27 (Opus blind review C-2): both were public,
  # unauthenticated tunnel routes exposing the receiver's live position, GPS
  # coordinates, and every tracked ACARS/VDL2 message to the raw internet.
  # Operator directive: lock down to Tailscale-only instead of CF Access
  # gating or removing outright -- both UIs are now reachable ONLY via the
  # tailnet, at 100.x.x.x:8081 (adsb/tar1090) and :8091 (acars/acarshub),
  # or the corresponding corporatetraveldc-dispatch.tailxxxxxxx.ts.net names.
  # No tunnel route means no public path to either exists at all.

  # executivestandard -- self-hosted mirror of "The Executive Standard"
  # (corporatetraveldc.substack.com), static files served by nginx. Same
  # caveat as every entry in this file: live routing is dashboard/API-
  # managed (see the "ops" note above) -- operator confirmed this hostname
  # is already provisioned on the real tunnel; this entry exists for
  # documentation accuracy, not to create the route.
  - hostname: executivestandard.example.com
    service: http://127.0.0.1:80

  # cloud -- Nextcloud second-brain vault (WebDAV/CalDAV)
  - hostname: cloud.example.com
    service: http://127.0.0.1:80

  # ntfy
  - hostname: ntfy.example.com
    service: http://127.0.0.1:80


  # pihole — CF Access gated (Tailscale + auth required)
  - hostname: pihole.example.com
    service: http://127.0.0.1:80

  # wrangler — CF Worker's primary upstream (smart-router fetches this,
  # not the public hostnames, which the Worker itself owns via zone routes)
  - hostname: wrangler.example.com
    service: http://127.0.0.1:80

  # apex and www — served by nginx (www.example.com.conf)
  # Note: the CF Worker owns these two hostnames at the zone-route level,
  # so this rule is only reached for traffic that bypasses the Worker
  # (e.g. direct-to-tunnel debugging). Real visitors go through the Worker
  # -> wrangler.example.com -> this same nginx vhost.
  - hostname: example.com
    service: http://127.0.0.1:80
  - hostname: www.example.com
    service: http://127.0.0.1:80

  # catch-all
  - service: http_status:404
