tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: /home/corporatetraveldc/.cloudflared/00000000-0000-0000-0000-000000000000.json

# Every hostname below routes to host nginx on :80 -- nginx does the actual
# per-vhost backend dispatch (see nginx/conf.d/*.conf), not cloudflared.
# This replaced the older per-service-port ingress list (each hostname
# pointing straight at its own backend port) once nginx started fronting
# everything; this file had drifted from that migration until 2026-07-10.
# dispatch-runner.example.com and cockpit.example.com are retired from the
# tunnel entirely -- see README.md's "dispatch-runner.example.com is retired
# as a live public endpoint" note. cockpit is host-management surface and is
# intentionally Tailscale-only now, not tunnel-exposed.
ingress:
  # dispatch — CF Access gated (Tailscale + auth required)
  - hostname: dispatch.example.com
    service: http://127.0.0.1:80

  # ops — PWA frontend, open over tunnel
  - hostname: ops.example.com
    service: http://127.0.0.1:80

  # openwebui — Open WebUI (Ollama chat frontend) — CF Access gated
  - hostname: openwebui.example.com
    service: http://127.0.0.1:80

  # ollama — raw Ollama API — CF Access gated
  - hostname: ollama.example.com
    service: http://127.0.0.1:80

  # adsb — UltraFeeder tar1090
  - hostname: adsb.example.com
    service: http://127.0.0.1:80

  # acars — acarshub
  - hostname: acars.example.com
    service: http://127.0.0.1:80

  # ntfy
  - hostname: ntfy.example.com
    service: http://127.0.0.1:80

  # pihole — CF Access gated (Tailscale + auth required)
  - hostname: pihole.example.com
    service: http://127.0.0.1:80

  # apex and www — no content yet
  - hostname: example.com
    service: http_status:503
  - hostname: www.example.com
    service: http_status:503

  # catch-all
  - service: http_status:404
