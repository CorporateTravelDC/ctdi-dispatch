tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: /home/corporatetraveldc/.cloudflared/00000000-0000-0000-0000-000000000000.json

# 2026-09-01 incident: the prior tunnel (a different, now-dead UUID) was
# deleted from the Cloudflare dashboard by accident (fat-fingered on
# mobile while trying to add a hostname route). Deleting a tunnel deletes
# every dashboard-managed Public Hostname/Published Application route with
# it -- there is no undelete. Recreated as a brand-new tunnel above and
# rebuilt every route from scratch, this time as a FULLY locally-managed
# ingress list (this file), not dashboard-managed -- so this file is now
# the actual source of truth for routing, unlike the old tunnel where the
# comment below (kept for history) had to warn that it wasn't.
#
# --- pre-incident history, no longer applicable now that routing is local ---
# CORRECTION 2026-08-05: that old tunnel was dashboard/API-managed, not
# locally-managed -- confirmed by restarting cloudflared and diffing this
# file's ingress list against the "Updated to new configuration" log line
# it printed on registration: the two lists didn't match at all (the live
# remote config included mcp./cockpit./dav.example.com, none
# of which appeared anywhere in this file). mcp./cockpit./dav. were flagged
# then as undocumented and worth an audit -- that audit happened as part of
# this incident: dav. is real and kept below; cockpit. had no live backend
# anywhere on the box (retired since the Raspbian->Fedora move) and was
# dropped entirely; mcp. is kept as a reserved hostname (sinkholed, no
# backend) per operator instruction, since it's demo-only/decommissioned
# right now but the hostname itself should keep existing.

ingress:
  # dispatch — CF Access gated (Tailscale + auth required)
  - hostname: dispatch.example.com
    service: http://127.0.0.1:80

  # ops.example.com RETIRED 2026-08-02 -- app layer already
  # hard-rejected this hostname (runner/main.py _RETIRED_HOSTNAMES) and no
  # nginx vhost has matched it since (falls to the default_server 444
  # catch-all). Live dispatch access is Tailscale-only now:
  # https://corporatetraveldc-dispatch.tailxxxxxxx.ts.net

  # dispatch-runner — public rolling demo (password-gated at the app
  # layer, see runner main.py DEMO_MODE). Open over tunnel same as ops,
  # since the gate happens after this hop, not before it. Added 2026-08-01.
  - hostname: dispatch-runner.example.com
    service: http://127.0.0.1:80

  # openwebui — Open WebUI (Ollama chat frontend) — CF Access gated
  - hostname: openwebui.example.com
    service: http://127.0.0.1:80

  # ollama — raw Ollama API — CF Access gated
  - hostname: ollama.example.com
    service: http://127.0.0.1:80

  # adsb/acars removed 2026-08-27 (Opus blind review C-2): both were public,
  # unauthenticated tunnel routes exposing the receiver's live position, GPS
  # coordinates, and every tracked ACARS/VDL2 message to the raw internet.
  # Operator directive: lock down to Tailscale-only instead of CF Access
  # gating or removing outright -- both UIs are now reachable ONLY via the
  # tailnet, at 100.x.x.x:8081 (adsb/tar1090) and :8091 (acars/acarshub),
  # or the corresponding corporatetraveldc-dispatch.tailxxxxxxx.ts.net names.
  # No tunnel route means no public path to either exists at all.

  # cloud -- Nextcloud second-brain vault (WebDAV/CalDAV)
  - hostname: cloud.example.com
    service: http://127.0.0.1:80

  # dav -- confirmed 2026-09-01: nginx vhost proxies to 127.0.0.1:8090,
  # same pattern as everything else here (tunnel -> nginx:80 -> nginx does
  # the real proxy_pass by Host header). Recovered from the incident audit.
  - hostname: dav.example.com
    service: http://127.0.0.1:80

  # mcp -- SINKHOLED 2026-09-01 per operator instruction: demo-only/
  # decommissioned right now, but the hostname should keep existing rather
  # than disappear. No backend -- cloudflared answers directly, nothing is
  # exposed. Re-point at http://127.0.0.1:80 (nginx already has a vhost,
  # proxies to 127.0.0.1:8083) if/when it comes back into real use.
  - hostname: mcp.example.com
    service: http_status:404

  # ntfy
  - hostname: ntfy.example.com
    service: http://127.0.0.1:80

  # pihole — CF Access gated (Tailscale + auth required)
  - hostname: pihole.example.com
    service: http://127.0.0.1:80

  # wrangler — CF Worker's primary upstream (smart-router fetches this,
  # not the public hostnames, which the Worker itself owns via zone routes)
  - hostname: wrangler.example.com
    service: http://127.0.0.1:80

  # apex and www — served by nginx (www.example.com.conf)
  # Note: the CF Worker owns these two hostnames at the zone-route level,
  # so this rule is only reached for traffic that bypasses the Worker
  # (e.g. direct-to-tunnel debugging). Real visitors go through the Worker
  # -> wrangler.example.com -> this same nginx vhost.
  - hostname: example.com
    service: http://127.0.0.1:80
  - hostname: www.example.com
    service: http://127.0.0.1:80

  # executivestandard -- self-hosted "The Executive Standard" blog mirror,
  # see nginx/conf.d/executivestandard.example.com.conf
  - hostname: executivestandard.example.com
    service: http://127.0.0.1:80

  # catch-all
  - service: http_status:404
