[Service]
# CPUWeight (cgroup v2 cpu.weight) instead of a static AllowedCPUs pin --
# weight only matters when something else is actually contending for CPU
# right now; the kernel scheduler re-evaluates every tick, live, with no
# polling daemon needed. Idle box: Ollama (and its llama-server children)
# can burst across all 4 cores for free. Under real contention with the
# dispatch containers (each at CPUWeight=100, see their .container files):
# 500 vs 100 means Ollama gets ~5x the contested CPU time -- clearly
# favored, without hard-starving the stack. This backstops the Modelfiles'
# own "PARAMETER num_thread 2" -- that only requests a thread count from
# llama.cpp, it does not by itself control OS-level scheduling priority.
CPUWeight=500

# Hard ceiling regardless of contention state -- no single inference run
# may ever claim more than 3 of the Pi's 4 cores, even if the box is
# otherwise completely idle. Same ceiling applied to every dispatch
# container (see CLAUDE.md "Container resource limits").
CPUQuota=300%

# Unload an idle model from memory after 10 minutes of no requests, so the
# Pi cools back toward baseline (60s-mid-60s C) between brief/OSINT runs
# instead of staying loaded (and hot) indefinitely.
Environment="OLLAMA_KEEP_ALIVE=10m"

# LLAMA_ARG_CACHE_RAM=0, added 2026-08-15 (root cause of the post-
# consolidation fallback wave). llama-server logs "prompt cache is
# enabled, size limit: 8192 MiB" at every model load: llama.cpp's host-
# RAM prompt cache snapshots each idle slot's KV state into anonymous
# process memory, default budget 8 GiB. phi3:mini has NO GQA (32 KV
# heads, ~384KB/token), so ONE 6144-ctx snapshot is up to ~2.3GB -- and
# since 2026-08-13/14 all 16 skills send different prompts through ONE
# long-lived llama-server, so the cache genuinely accumulates in a way
# the old per-skill models (fresh llama-server per model swap) never
# did. Confirmed live 2026-08-15 00:20: fresh restart, model + one
# 6144 KV slot idle = memory.current 5.05GB with memory.events `high`
# stable; the moment a SECOND task arrived, the idle slot got
# snapshotted into the cache (llama-server RSS +760MB in one 15s
# sample) pushing the cgroup from 5.05GB to 5.78GB -- past
# MemoryHigh -- and `high` events went from 566 to 40,000+ and kept
# climbing for the rest of the generate. With MemorySwapMax=0 (below),
# anonymous memory is unreclaimable, so above MemoryHigh the kernel's
# only lever is allocation-throttling the whole cgroup: measured
# effect tonight was ~1 tok/s generation, /api/tags taking 6-57s
# (normally ~2ms), 107 broken-pipe 500s in 12h from 3s readiness
# probes giving up, and generate calls running 8m55s-14m28s into
# their callers' timeouts. The same cold load that stalled ~9min
# under the clamp completed in 9.33s the moment the throttle
# released -- hardware was never the bottleneck.
#
# Ollama 0.31.1 exposes no first-class knob for --cache-ram, but
# llama-server reads the LLAMA_ARG_CACHE_RAM env equivalent
# (same mechanism as the LLAMA_ARG_FIT vars Ollama itself documents),
# and ollama serve passes its environment through to its llama-server
# children. 0 disables the prompt cache outright: an 8 GiB cache
# budget can never fit inside ANY affordable cgroup ceiling on this
# 16GB box, and the single shared slot already keeps the hot persona
# prefix KV resident between calls (in-slot prefix reuse), which is
# the reuse pattern that actually matters now that every call shares
# the same ~2050-token persona prefix. Verify after each ollama
# upgrade: the load-time journal line must NOT say
# "prompt cache is enabled, size limit: 8192 MiB" any more.
Environment="LLAMA_ARG_CACHE_RAM=0"

# RE-BASELINED AGAIN 2026-08-15: the 2026-08-13/14 model consolidation
# (16 per-skill models -> one shared corporatetraveldc-pi5-brief,
# num_ctx 6144) obsoleted the 2026-08-07 baseline of B=~4.1GB. Measured
# live 2026-08-15 00:20 (fresh llama-server, corporatetraveldc-pi5-brief
# loaded, one 6144-ctx slot, prompt cache empty, idle between tasks):
# memory.current = 5,054,267,392 bytes = 4820 MiB. Components per
# llama-server's own allocation log: 53.6 MiB model + 2021 MiB
# CPU_REPACK weights + 2304 MiB KV (6144 ctx, no-GQA phi3) + 144 MiB
# compute buffer = 4523 MiB, plus llama-server heap/tokenizer, the
# ollama serve Go daemon (~40MB) and ~230 MiB reclaimable file cache
# from reading the model blob (--no-mmap reads it through the page
# cache). New B = 4820 MiB; same operator-specified formula as
# 2026-08-07 (Low = 100% of B, High = 125%, Max = 150%). The old
# High=5100M was BELOW this at-rest footprint, so post-consolidation
# the cgroup lived permanently inside the memory.high allocation
# throttle (high events 214,758 and counting at 2026-08-15 00:07) --
# the same chronic-reclaim failure class as 2026-08-07, recurring at a
# higher baseline. NOTE these numbers assume LLAMA_ARG_CACHE_RAM=0
# (above) stays in effect -- with the 8 GiB prompt cache enabled there
# is no affordable ceiling, so if that line is ever removed these
# numbers are invalid and must be re-measured.
#
# Memory cap, added 2026-07-31, RE-BASELINED 2026-08-07. Original B =
# ~3.1GB was a single fresh-load snapshot of corporatetraveldc-pi5-osint.
# Root-caused 2026-08-07 (gig-economy-daily-watch fallback investigation,
# same swap-thrashing symptom recurring despite the 2026-08-06 MemoryLow
# fix being correctly in effect): confirmed live via memory.current/
# memory.events/memory.stat that a long-running llama-server process
# (--context-shift, --keep 4, many consecutive overnight skill calls,
# hours of uptime) settles at a real steady-state footprint of ~4064MB --
# already ABOVE the old MemoryHigh=3900M ceiling at REST, before any
# request-time spike. That's why it was chronic, not occasional:
# memory.events showed `high` thrown 38.19 MILLION times and
# memory.stat showed 1.29 million major page faults -- the kernel was
# continuously reclaiming/swapping part of Ollama's OWN cgroup against
# its own self-imposed ceiling, unconditionally, regardless of whether
# the rest of the box had free RAM (MemoryLow=3100M below only protects
# against EXTERNAL pressure from other cgroups -- it was correctly in
# effect and was never the failing mechanism here). New B = ~4.1GB
# (today's live memory.current, rounded up slightly for headroom), same
# operator-specified 125%/150% formula as before, MemoryLow left
# unchanged (not implicated in this root cause, out of scope for this
# specific fix).
#
# MemoryHigh = 125% of new B (~5.1GB): soft threshold. Above this the
# kernel actively reclaims from this cgroup (page cache first, then
# swap) on an ongoing basis.
# 2026-08-15: 5100M -> 6050M = 125% of B=4820 MiB (see re-baseline
# comment above).
MemoryHigh=6050M

# MemoryMax = 150% of new B (~6.1GB): hard ceiling on the cgroup's own
# resident memory. Deliberately set above MemoryHigh so reclaim has room
# to work gracefully instead of hitting an immediate OOM wall.
# 2026-08-15: 6100M -> 7250M = 150% of B=4820 MiB (see re-baseline
# comment above). 7250 MiB still leaves ~8.3GB of the Pi's 15.6GB for
# the rest of the stack (measured non-Ollama usage tonight: ~4.5GB
# plus desktop session).
MemoryMax=7250M

# MemorySwapMax=0, added 2026-08-07 (was 1000M). Root-caused 2026-08-07
# (10:00 ET ops-brief fallback investigation, resumed even at the
# rebaselined 5100M/6100M/1000M ceiling): the worst observed spike had
# memory.current+memory.swap.current = ~4242MB at the moment of failure,
# comfortably under MemoryMax=6100M (1858MB headroom) -- meaning the
# cgroup had room to hold that entire working set in RAM without ever
# touching swap. What was actually happening: repeated cold-load bursts
# (see MemoryHigh comment below for the reload-churn mechanism) getting
# PARTIALLY pushed into swap under MemoryHigh pressure, then needing to
# be paged back IN under load moments later -- that page-in is genuine
# blocking disk/zram-compression I/O (confirmed live: llama-server sat
# in D-state, its own /health endpoint didn't respond for 2+ minutes),
# which is what produced the 149-second thrash-then-fallback pattern.
# Zero swap does not fix WHY the demand spikes (that's the reload-churn
# investigation, 2026-08-07, in progress separately) -- it changes the
# FAILURE MODE for the better: with no swap to partially commit to and
# then stall paging back in, a memory spike now resolves via fast page-
# cache reclaim (no compression/decompression, no blocking I/O the same
# way) or, if genuinely unsatisfiable, a fast/loud OOM-kill instead of a
# silent multi-minute stall -- ollama.service already has Restart=always/
# RestartUSec=3s, so a hard OOM self-heals in 3 seconds. Given every
# observed spike tonight (including the worst one) stayed well under
# MemoryMax even with its swap portion counted in, an OOM-kill under
# normal load looks unlikely; if it does happen, that itself is a much
# louder and more useful signal than today's silent thrash-then-fallback.
MemorySwapMax=0

# MemoryLow, added 2026-08-06. Previously 0 (unset) -- MemoryHigh/Max/
# SwapMax cap Ollama's OWN ceiling, but do nothing to protect it from an
# UNRELATED cgroup (e.g. the interactive desktop session -- Brave, Claude
# Desktop, both running under user@1000.service/app.slice) driving the
# whole box into memory pressure. Under real system-wide pressure the
# kernel reclaims globally, respecting only each cgroup's own memory.low/
# memory.min protection -- with both at 0, Ollama had zero priority and
# got reclaimed/swapped right alongside everything else. Confirmed live:
# ~690MB of Ollama's own footprint was sitting in swap (against its 750MB
# MemorySwapMax ceiling -- nearly maxed) while system swap usage overall
# was 3.4-3.7GB, meaning most of that system-wide swap was NOT Ollama's
# own cgroup, driven by pressure from elsewhere with nothing to stop it
# reaching in.
#
# 3100M = 100% of B (the same measured baseline used for the 125%/150%
# figures above) -- protects Ollama's real normal working set (model +
# context loaded) from reclaim entirely as long as memory is available
# anywhere else on the box. Anything above that baseline (transient
# spikes) still falls back to the existing MemoryHigh/Max/SwapMax
# handling, unchanged.
# 2026-08-15: 3100M -> 4850M = 100% of B=4820 MiB rounded up (see
# re-baseline comment above) -- unlike 2026-08-07, MemoryLow IS in
# scope this time because the baseline itself moved: the consolidated
# model's real working set (4820 MiB) was sitting 1.7GB above the old
# protection line, so external pressure (desktop session etc.) could
# legitimately reclaim against the model's own working set.
MemoryLow=4850M
