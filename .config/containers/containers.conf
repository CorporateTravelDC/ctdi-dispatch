# ~/.config/containers/containers.conf
#
# Host-wide rootless Podman network defaults.
#
# pasta_options = ["--map-gw"] restores the host.containers.internal alias
# for BRIDGE-networked containers (e.g. corporatetraveldc-acarshub on
# acars-net.network). Rootless Podman's bridge networking is itself tunneled
# through one shared rootless-netns pasta process; that process runs with
# --no-map-gw by default, which breaks host.containers.internal for every
# bridge-networked container regardless of what that container binds to.
#
# This is host-wide, not per-container -- unlike Network=pasta:--map-gw on a
# single container's own quadlet (see openwebui.container,
# corporatetraveldc-pusher.container), there is no per-container equivalent
# for containers on a named bridge network. Setting this here makes
# host.containers.internal reachable for every bridge-networked container on
# this host (currently only corporatetraveldc-acarshub actually calls it;
# corporatetraveldc-acarsrouter, corporatetraveldc-acars-watcher, and
# corporatetraveldc-dumpvdl2 share the same acars-net.network and gain the
# capability too, though none of them currently use it).
#
# Containers using podman's default rootless networking directly (not a
# named .network bridge) are unaffected by this setting either way -- they
# opt in individually via Network=pasta:--map-gw on their own quadlet.

[network]
pasta_options = ["--map-gw"]
