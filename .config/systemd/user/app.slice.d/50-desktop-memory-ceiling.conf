[Slice]
# 2026-08-06: parent-level memory ceiling on the interactive desktop
# session. Root cause this closes: user-1000.slice and user@1000.service
# both had MemoryHigh/MemoryMax/MemorySwapMax=infinity -- individual
# units (ollama.service, ops-brief.container, etc.) had their own caps,
# but nothing bounded the desktop session as a whole, so Brave + Claude
# Desktop could drive the box into genuine system-wide memory pressure
# with no ceiling anywhere above them. That pressure forced kernel-wide
# swap reclaim that reached into every cgroup (including ollama.service's
# own, up to its 750MB swap cap, which was observed sitting almost
# exactly at that ceiling) and tanked Ollama inference from ~1s/token to
# ~10s/token. See chat history 2026-08-06 for the full investigation.
#
# All production containers were moved OUT of app.slice into a new
# sibling production.slice (see .config/systemd/user/production.slice
# and every .container Quadlet's new Slice=production.slice) specifically
# so this ceiling only ever bounds desktop GUI apps -- app.slice now
# holds just Brave, Claude Desktop, and a handful of tiny D-Bus/session
# helper services (dconf, a11y, secrets -- negligible memory).
#
# Sizing, from real measured footprint on this box, not a guess:
#   Brave (4 tabs open, the operator's stated normal ceiling): ~1061 MB
#   Claude Desktop (Electron shell + renderers, excl. its VM):  ~1150 MB
#   Claude Desktop's own "Cowork" VM (qemu -m 4096M):         up to 4096 MB
#                                                    current total: ~2.6 GB
#
# MemoryHigh = 6144M: soft threshold. Above this the kernel proactively
# reclaims from app.slice (page cache first) -- this is what should make
# a runaway tab/session slow down and get throttled instead of silently
# consuming everything, well before anything gets OOM-killed. Gives ~2.3x
# headroom over today's real usage for legitimate growth (heavier pages,
# more scripts) while a single Brave + Claude Desktop session is running.
#
# MemoryMax = 8192M: hard ceiling. Covers current usage (~2.6GB) plus the
# Cowork VM's own full 4GB allocation plus real growth headroom, while
# leaving guaranteed room on a 15GB box for ollama.service (up to 4.65GB)
# and the whole production.slice stack. Exceeding this OOM-kills within
# app.slice specifically -- desktop apps, not production.
#
# MemorySwapMax = 1024M: a small allowance rather than zero, so a brief
# overage doesn't instantly kill a browser tab -- but capped tightly
# enough that the desktop session can never again be the dominant
# contributor to system-wide swap the way it was tonight.
MemoryHigh=6144M
MemoryMax=8192M
MemorySwapMax=1024M
