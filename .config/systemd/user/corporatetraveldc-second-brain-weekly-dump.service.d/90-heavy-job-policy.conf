# Shared heavy-job policy; generated from config/heavy-job-policy.json.
[Unit]
Wants=corporatetraveldc-heavy-job-manager.service
After=corporatetraveldc-heavy-job-manager.service
OnFailure=corporatetraveldc-unit-failure-notify@%n.service

[Service]
Slice=production-brain.slice
MemoryHigh=2G
MemoryMax=2560M
MemorySwapMax=4G
# Queue admission is a condition: it never extends the workload timeout.
ExecCondition=/usr/bin/python3 -B /opt/corporatetraveldc/private/ctdi-dispatch-internal/scripts/heavy-job-policy.py admit %n
ExecStopPost=/usr/bin/python3 -B /opt/corporatetraveldc/private/ctdi-dispatch-internal/scripts/heavy-job-policy.py release %n
