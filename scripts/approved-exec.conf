# scripts/approved-exec.conf -- root allowlist for scripts/approved-exec.py (2026-10-07).
# Installed root-owned beside it. One line per approval pattern:
#   <command_pattern><TAB><regex that must FULLMATCH shlex.join(argv), argv[0] absolute>
# Only commands a human signed for exactly this pattern, in exactly this shape, run as root.
dnf-remove	/usr/bin/dnf remove( -y)?( [A-Za-z0-9][A-Za-z0-9._+:-]*)+
dnf-autoremove	/usr/bin/dnf autoremove( -y)?
semanage-port-add	/usr/s?bin/semanage port -a -t [a-z0-9_]+ -p (tcp|udp) [0-9]{1,5}
