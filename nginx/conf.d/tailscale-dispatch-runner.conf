# dispatch-runner — Tailscale HTTPS only
# https://corporatetraveldc-dispatch.tailxxxxxxx.ts.net

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name corporatetraveldc-dispatch.tailxxxxxxx.ts.net;

    ssl_certificate     /etc/nginx/ssl/tailscale-dispatch.crt;
    ssl_certificate_key /etc/nginx/ssl/tailscale-dispatch.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        limit_req          zone=corporatetraveldc_lr burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # 2026-08-25 fix (Opus blind review C-2): $proxy_add_x_forwarded_for
        # APPENDS to any X-Forwarded-For the client already sent, so a
        # caller could inject an arbitrary leftmost value and have nginx
        # forward it straight through. $remote_addr is nginx's own
        # directly-observed TCP peer address -- always set from here,
        # never from a client-supplied header.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name corporatetraveldc-dispatch.tailxxxxxxx.ts.net;
    return 301 https://$host$request_uri;
}
