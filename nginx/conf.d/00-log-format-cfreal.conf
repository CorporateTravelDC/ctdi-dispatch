# nginx/conf.d/00-log-format-cfreal.conf -- access-log format that keeps the
# REAL client address of Cloudflare-tunnel traffic (2026-10-05).
#
# Behind cloudflared every request reaches nginx from 127.0.0.1, so the stock
# "combined" format recorded only the tunnel hop: on 2026-10-05 it was
# impossible to say from the logs where Cowork's September requests came from
# (only their curl/8.5.0 user agent survived). cf= is Cloudflare's
# CF-Connecting-IP header ("-" for tailnet/LAN requests that never touched
# Cloudflare). Field order otherwise matches "combined", so existing parsers
# that split on double quotes (request, referer, user agent) still work.
log_format cfreal '$remote_addr cf=$http_cf_connecting_ip - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
