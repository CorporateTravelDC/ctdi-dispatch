# 00-http2-off.conf -- 2026-11-19 (operator): HTTP/2 disabled everywhere.
# nginx HTTP/2 CVE; Fedora ships nginx 1.30.6 and the fixed 1.31.9 is not packaged yet.
# http-level default for every server; each tracked server block also says `http2 off;` explicitly,
# because a server-level `http2 on` would override this. tests/scripts/test_http2_off.py fails on any
# active `http2 on` or legacy `listen ... http2`. Re-enable only after nginx >= 1.31.9 is installed.
http2 off;
