# mcp.example.com — public-safe MCP-over-OpenAPI bridge
# (corporatetraveldc-mcpo-public.service, dispatch_mcp with
# DISPATCH_MCP_PUBLIC_SAFE=1 -- admin.py and second_brain.py never
# registered, see dispatch_mcp/tools/__init__.py).
#
# Cloudflare terminates TLS; nginx sees plain HTTP from cloudflared.
#
# X-CTDI-Public: 1 -- same pattern as dispatch.example.com.conf.
# Belt-and-suspenders here: the public-safe tool subset is already enforced
# at the process level (this vhost's backend never loaded admin/second_brain
# in the first place), but every other public vhost in this repo sets this
# marker unconditionally, and dispatch_mcp's own outbound calls to the
# dispatch API carry it through so the web API's tier resolution stays
# consistent regardless of which public entry point was used.
#
# MUST NOT proxy to :8082 (corporatetraveldc-mcpo.service, the full/admin
# instance) -- that instance is loopback-only by design and must never get
# a public or LAN-reachable hostname. This vhost proxies to :8083 only.
server {
    listen 80;
    server_name mcp.example.com;

    location / {
        limit_req          zone=corporatetraveldc_lr burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8083;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-CTDI-Public "1";
        proxy_read_timeout 120s;
        proxy_buffering    off;
        proxy_cache        off;
    }

    access_log /var/log/nginx/mcp-access.log;
    error_log  /var/log/nginx/mcp-error.log;
}
