# 00-rate-limit-corporatetraveldc.conf
#
# Per-source-IP rate limiting -- nginx's own equivalent of Cloudflare's
# rate-based DDoS challenge. Zone must be defined before any vhost's
# `limit_req zone=corporatetraveldc_lr` reference; the "00-" filename
# prefix loads this first among conf.d/*.conf (nginx.conf itself isn't
# tracked here -- it's stock Fedora -- but its
# `include /etc/nginx/conf.d/*.conf;` sits inside the http{} block, so this
# file is loaded at http context, same as if it were in nginx.conf).
#
# Ban action: fail2ban's nginx-limit-req filter (already shipped by the
# fail2ban package) watches error.log for the "limiting requests, excess"
# line this produces, and jail.d/nginx-limit-req-corporatetraveldc.conf's
# custom action bans the offending IP via firewalld. See
# COMPLIANCE_SECURITY.md's "Container Network Isolation" section for
# background on the stack's network-isolation model.
#
# CORRECTED 2026-08-26 (Opus blind review C-1): both zones below used to
# key on $binary_remote_addr directly. Every tunnel-routed request reaches
# nginx from cloudflared over loopback (see cloudflared/config.yml --
# every hostname routes to http://127.0.0.1:80), so the "per-source-IP"
# limit was actually one global bucket shared by the entire internet --
# confirmed live, the sibling 00-honeypot.conf documents and fixes this
# exact problem for its own jail via a $honeypot_addr map, but this file
# never got the same treatment. Re-keyed on the real client IP the same
# way: prefer CF-Connecting-IP (set authoritatively by Cloudflare at its
# edge for tunnel-routed traffic), fall back to $remote_addr for direct/
# LAN/tailnet hits where that header is genuinely absent.
map $http_cf_connecting_ip $ratelimit_addr {
    default  $remote_addr;
    "~.+"    $http_cf_connecting_ip;
}

limit_req_zone $ratelimit_addr zone=corporatetraveldc_lr:10m rate=10r/s;

# Tighter zone specifically for the demo login endpoint, now internet-
# reachable and password-guessable. Added 2026-08-01 live; this tracked
# copy had drifted and never carried it (Opus blind review M-4) -- synced
# here, re-keyed the same as the zone above.
limit_req_zone $ratelimit_addr zone=corporatetraveldc_demo_login:10m rate=1r/s;
