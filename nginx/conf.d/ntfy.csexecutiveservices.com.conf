# ntfy.example.com — self-hosted ntfy push server
# Cloudflare terminates TLS; nginx sees plain HTTP from cloudflared.
# ntfy uses long-lived connections for subscriptions — disable buffering.

# 2026-08-30: newer ntfy mobile app builds default to a native WebSocket
# subscription (io.heckel.ntfy.service.WsConnection) instead of long-poll/
# SSE. The old unconditional `proxy_set_header Connection "";` below
# stripped the client's Connection/Upgrade headers on EVERY request,
# including a WebSocket upgrade attempt -- ntfy never saw it as an
# upgrade request at all, so it answered with a normal HTTP response
# instead of 101 Switching Protocols. Confirmed live: exact failure mode
# was WebSocketNotSupportedException / "Expected HTTP 101 response but
# was ...". This map conditionally sets Connection to "upgrade" (and
# forwards the Upgrade header) only when the client is actually
# requesting one, and "close" otherwise -- nginx's own documented
# WebSocket reverse-proxy pattern -- so both WebSocket and plain
# long-poll/SSE clients work through the same vhost.
map $http_upgrade $ntfy_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ntfy.example.com;

    location / {
        limit_req          zone=corporatetraveldc_lr burst=20 nodelay;
        proxy_pass         http://127.0.0.1:2586;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $ntfy_connection_upgrade;
    }

    access_log /var/log/nginx/ntfy-access.log;
    error_log  /var/log/nginx/ntfy-error.log;
}
