# ntfy.csexecutiveservices.com — self-hosted ntfy push server
# Cloudflare terminates TLS; nginx sees plain HTTP from cloudflared.
# ntfy uses long-lived connections for subscriptions — disable buffering.

server {
    listen 80;
    server_name ntfy.csexecutiveservices.com;

    location / {
        proxy_pass         http://127.0.0.1:2586;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
    }

    access_log /var/log/nginx/ntfy-access.log;
    error_log  /var/log/nginx/ntfy-error.log;
}
