# executivestandard.example.com — self-hosted mirror of
# "The Executive Standard" (corporatetraveldc.substack.com). Static files
# only, generated by poller/skills/executive_standard_sync.py into
# /var/www/executivestandard.example.com/ -- nginx just serves
# them. Substack stays the subscribe/email destination; this is the
# operator's own permanent, self-hosted copy (build-vs-rent).
#
# Lives under /var/www, same as example.com itself, not under
# /var/lib/corporatetraveldc -- that tree already carries a container_file_t
# SELinux default for the podman bind-mounts elsewhere under it, which fights
# any httpd-served subdirectory nested inside it (every regenerated file
# inherits container_file_t from the parent on creation, needing restorecon
# after every sync). /var/www is root-owned and covered by SELinux's own
# stock httpd_sys_content_t default, so nothing ever needs relabeling here.
#
# 2026-09-02: Accept: text/markdown content negotiation (RFC 8288 alternate
# representation) -- same proven pattern as csexecutiveservices-website's
# own nginx config (nginx/www.example.com.conf there), adapted
# to this site's structure. executive_standard_sync.py's build_site()
# writes the markdown counterparts into _md/ (index.md + <slug>.md), never
# alongside the .html files -- served ONLY through the internal /_md/
# location below, reached via the negotiated rewrite, so a direct request
# for that path can't bypass the Accept-header check.
map $http_accept $wants_md {
    default           0;
    "~*text/markdown" 1;
}

# Only rewrite when a markdown counterpart genuinely exists: root and any
# *.html page. Everything else (assets/manifest/sw.js/etc.) is untouched --
# $md_target stays empty and try_files falls through as normal.
map "$wants_md:$uri" $md_target {
    default                   "";
    "~^1:/$"                  "/_md/index.md";
    "~^1:/(?<stem>.+)\.html$" "/_md/$stem.md";
}

# Same applicability check, independent of Accept, used to advertise the
# alternate representation via Link header on the HTML response itself.
map $uri $md_link_header {
    default            "";
    "~^/(.*\.html)?$"  "<$request_uri>; rel=\"alternate\"; type=\"text/markdown\"";
}

server {
    listen 80;
    server_name executivestandard.example.com;

    root /var/www/executivestandard.example.com;
    index index.html;

    add_header X-Content-Type-Options nosniff;
    add_header Link '</llms.txt>; rel="llms.txt"' always;
    add_header Link $md_link_header always;
    add_header Vary Accept always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json text/markdown;

    location / {
        limit_req zone=corporatetraveldc_lr burst=20 nodelay;
        # A real internal redirect is required here, not a try_files
        # candidate -- try_files only stats a literal path and never
        # re-enters location matching for its intermediate arguments.
        if ($md_target != "") {
            rewrite ^ $md_target last;
        }
        try_files $uri $uri/ $uri.html =404;
    }

    # Internal target for negotiated markdown responses. Not directly
    # reachable -- only entered via $md_target from location / above.
    location ^~ /_md/ {
        internal;
        alias /var/www/executivestandard.example.com/_md/;
        types { text/markdown md; }
        default_type text/markdown;
        add_header Vary Accept always;
    }

    access_log /var/log/nginx/executivestandard-access.log;
    error_log  /var/log/nginx/executivestandard-error.log;
}
