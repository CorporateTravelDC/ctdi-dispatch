# 00-honeypot.conf -- http-context pieces for the honeypot/fail2ban trap system.
# Loads before the vhosts (00- prefix). The per-server trap LOCATIONS live in
# snippets/honeypot.conf, included by each protected server block.
#
# Purpose (see docs/HONEYPOT_FAIL2BAN.md): auto-ban two classes of bad actor --
#   (a) AI crawlers/agents that ignore robots.txt / llm.txt and fetch paths they
#       were explicitly told not to, and
#   (b) vulnerability scanners/bots probing for wp-admin, .env, .git, phpMyAdmin,
#       etc. -- paths this stack never legitimately serves.
# Any hit is logged to /var/log/nginx/honeypot.log; a fail2ban jail bans the IP.

# Resolve the REAL client IP: services fronted by the Cloudflare tunnel arrive
# from cloudflared (127.0.0.1), with the true client in CF-Connecting-IP. Prefer
# that header when present; fall back to the direct peer for LAN/tailnet hits.
# (Honesty caveat in the doc: a local firewall ban is only *effective* for
# direct/LAN/tailnet sources; for CF-tunnelled traffic this captures the real IP
# for logging / Cloudflare-side blocking, but the local ban can't stop packets
# that arrive from cloudflared.)
map $http_cf_connecting_ip $honeypot_addr {
    default  $remote_addr;
    "~.+"    $http_cf_connecting_ip;
}

# IP first so the fail2ban failregex is a trivial ^<HOST>. "trap" tag + the
# request/host/UA give enough to eyeball what tripped it.
log_format honeypot '$honeypot_addr - [$time_local] "$request" host=$host ua="$http_user_agent" TRAP';
