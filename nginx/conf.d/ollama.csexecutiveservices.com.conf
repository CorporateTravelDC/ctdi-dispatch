# Ollama binds its Tailscale IP, not 127.0.0.1 -- pasta's --map-gw (used by
# openwebui to reach it) cannot deliver to a strictly loopback-bound socket;
# the kernel refuses externally-arriving traffic to 127.0.0.0/8 regardless
# of NAT/routing (anti-spoofing). See install/ollama/install-ollama.sh.
server {
    listen 80;
    server_name ollama.example.com;
    location / {
        limit_req          zone=corporatetraveldc_lr burst=20 nodelay;
        proxy_pass         http://100.x.x.x:11434;
        proxy_set_header   Host 100.x.x.x:11434;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
