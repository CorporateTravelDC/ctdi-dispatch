# dispatch.example.com — corporatetraveldc dispatch REST API
# Cloudflare terminates TLS; nginx sees plain HTTP from cloudflared.
#
# X-CTDI-Public: 1 (2026-08-05) -- authoritative "this request arrived via
# the public tunnel" marker for auth.py's resolve_tier(). Set with a
# literal proxy_set_header, which REPLACES any client-supplied value for
# that header name outright (unlike X-Forwarded-For below, which uses
# $proxy_add_x_forwarded_for and deliberately APPENDS to preserve a proxy
# chain -- that append-not-replace behavior is exactly what made the old
# Tailscale-XFF-prefix trust check spoofable from the open internet).
# Empirically verified: a client sending X-CTDI-Public: 0 here still
# reaches the app as "1". MUST be set in every location block in this
# file -- nginx location blocks that define their own proxy_set_header
# directives do NOT inherit the server-level ones, so a location that
# omits this line lets the client's own header value pass straight
# through unmodified (verified the same way). Both blocks below currently
# proxy to :8000, both carry it.
server {
    listen 80;
    server_name dispatch.example.com;

    # Honeypot traps -> fail2ban auto-ban (AI directive-ignorers + vuln scanners).
    # See docs/HONEYPOT_FAIL2BAN.md; requires conf.d/00-honeypot.conf.
    include /etc/nginx/snippets/honeypot.conf;

    location / {
        limit_req          zone=corporatetraveldc_lr burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-CTDI-Public "1";
        proxy_read_timeout 120s;
        proxy_buffering    off;
        proxy_cache        off;
    }

    location = /api/v1/events {
        proxy_pass         http://127.0.0.1:8000/api/v1/events;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-CTDI-Public "1";
    }

    access_log /var/log/nginx/dispatch-access.log;
    error_log  /var/log/nginx/dispatch-error.log;
}
