# dispatch.csexecutiveservices.com — corporatetraveldc dispatch REST API
# Cloudflare terminates TLS; nginx sees plain HTTP from cloudflared.

server {
    listen 80;
    server_name dispatch.csexecutiveservices.com;

    location / {
        limit_req          zone=corporatetraveldc_lr burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering    off;
        proxy_cache        off;
    }

    location = /api/v1/events {
        proxy_pass         http://127.0.0.1:8000/api/v1/events;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   X-Forwarded-Proto https;
    }

    access_log /var/log/nginx/dispatch-access.log;
    error_log  /var/log/nginx/dispatch-error.log;
}
