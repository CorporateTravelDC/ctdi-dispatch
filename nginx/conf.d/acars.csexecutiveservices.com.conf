# Backend not currently deployed (port 9081 closed, no acarshub container found) — vhost ready for when it is.
server {
    listen 80;
    server_name acars.example.com;
    location / {
        limit_req          zone=corporatetraveldc_lr burst=20 nodelay;
        proxy_pass         http://127.0.0.1:9081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
