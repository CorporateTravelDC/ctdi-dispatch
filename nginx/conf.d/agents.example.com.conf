# nginx/conf.d/agents.example.com.conf -- public hostname for the
# cloud-agent OAuth + MCP gateway (2026-10-05; src/web/routes/agent_gateway.py,
# docs/AGENT_SEGMENTATION.md "Agent gateway"). Reached only through the
# Cloudflare tunnel (cloudflared ingress agents.example.com).
# Exposes ONLY the OAuth endpoints, the MCP endpoints and their two
# .well-known metadata documents; everything else is 404 -- the dispatch API,
# board and dashboards are not reachable on this name. The Authorization
# header is passed through untouched (nginx default); the web app does all
# authentication itself.
server {
    listen 80;
    server_name agents.example.com;

    include /etc/nginx/snippets/honeypot.conf;
    access_log /var/log/nginx/agents-access.log cfreal;
    error_log  /var/log/nginx/agents-error.log;
    client_max_body_size 1m;

    location ~ ^/(\.well-known/oauth-(authorization-server|protected-resource)(/mcp/[a-z0-9-]+)?|oauth/(register|authorize|authorize/status|token|revoke)|mcp/[a-z0-9-]+)$ {
        limit_req          zone=corporatetraveldc_lr burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    location / { return 404; }
}
